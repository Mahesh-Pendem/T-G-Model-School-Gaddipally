<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Sent</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: #fff;
    }

    .card {
      background: #ffffff;
      color: #333;
      border-radius: 12px;
      padding: 20px 30px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      animation: pop 0.4s ease;
    }

    .card h1 {
      font-size: 24px;
      margin-bottom: 10px;
      color: #4caf50;
    }

    .card p {
      font-size: 16px;
      margin-bottom: 20px;
      color: #555;
    }

    .checkmark {
      font-size: 50px;
      color: #4caf50;
      margin-bottom: 15px;
      animation: bounce 1s infinite;
    }

    .button {
      display: inline-block;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background-color: #4caf50;
      border: none;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.3s;
    }

    .button:hover {
      background-color: #43a047;
    }

    @keyframes pop {
      0% {
        transform: scale(0.8);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-10px);
      }
      60% {
        transform: translateY(-5px);
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="checkmark">✔</div>
    <h1>Message Sent Successfully!</h1>
    <p>Your message has been delivered. We'll get back to you shortly.</p>
    <a href="portfolio1.html" class="button">Go Back to Home</a>
  </div>
</body>
</html>
